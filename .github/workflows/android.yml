name: Android
# Runs the engine tests and builds the debug APK on every change to the Android app.
on:
  push:
    paths: ['app/android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests and debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew test assembleDebug --no-configuration-cache
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
